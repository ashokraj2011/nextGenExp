<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">How Treatment Selector and sfield work together</title>
  <desc id="description">The app receives Marcus’s address update. Through sfield the routing model identifies the topic and Treatment Selector checks CCRE rules. Legacy TS returns content IDs. The proposed response adds an independent address action and a funding workflow. When Marcus chooses, sfield either prepares an address review or runs three funding preview tools in order.</desc>
  <defs>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #18382d; }
      .title { font-size: 40px; font-weight: 700; letter-spacing: -1px; }
      .sub { font-size: 20px; fill: #485f54; }
      .label { font-size: 16px; font-weight: 700; fill: #315f4d; }
      .head { font-size: 24px; font-weight: 700; }
      .body { font-size: 18px; fill: #354e43; }
      .code { font-family: ui-monospace, Menlo, monospace; font-size: 17px; }
      .line { stroke: #527568; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1440" height="810" fill="#fafcf9"/>
  <text x="52" y="65" class="title">How Treatment Selector and sfield work together</text>
  <text x="54" y="99" class="sub">Marcus asks, “I moved and need to update my address.” He also has an account awaiting its first deposit.</text>

  <rect x="52" y="124" width="1336" height="80" rx="12" fill="#eef3ee" stroke="#c5d4ca"/>
  <text x="74" y="153" class="label">Existing TS contract</text>
  <text x="74" y="183" class="code">[address_update_guide, fund_account]</text>
  <path d="M542 165h60m-8-6 8 6-8 6" class="line"/>
  <text x="640" y="153" class="label">Proposed TS contract · same member ID and context</text>
  <text x="640" y="183" class="body">Ordered content IDs plus versioned action and workflow references</text>

  <g>
    <rect x="52" y="238" width="384" height="133" rx="13" fill="#fff" stroke="#c4d3c8"/>
    <text x="74" y="268" class="label">1 · Chat and app server</text>
    <text x="74" y="302" class="head">Identify the customer</text>
    <text x="74" y="333" class="body">Identify Marcus and pass his message</text>
    <text x="74" y="356" class="body">and recent chat to sfield.</text>
    <path d="M442 303h47m-8-6 8 6-8 6" class="line"/>
    <rect x="498" y="238" width="390" height="133" rx="13" fill="#edf4f8" stroke="#afc9d5"/>
    <text x="520" y="268" class="label">2 · sfield and the routing model</text>
    <text x="520" y="302" class="head">Identify the request</text>
    <text x="520" y="333" class="body">The app verifies the model’s intent.</text>
    <text x="520" y="356" class="body">sfield calls TS with MID and context.</text>
    <path d="M894 303h47m-8-6 8 6-8 6" class="line"/>
    <rect x="950" y="238" width="438" height="133" rx="13" fill="#eaf4eb" stroke="#acc8b3"/>
    <text x="972" y="268" class="label">3 · Treatment Selector and CCRE</text>
    <text x="972" y="302" class="head">Decide what qualifies</text>
    <text x="972" y="333" class="body">Evaluate the address topic and Marcus’s</text>
    <text x="972" y="356" class="body">funding status. Return eligible references.</text>
  </g>
  <path d="M1170 371v34H249v-25m-6 8 6-8 6 8" class="line"/>
  <rect x="361" y="386" width="704" height="34" rx="17" fill="#fafcf9"/>
  <text x="713" y="410" class="label" text-anchor="middle">4 · TS → sfield → app · Render the guide, address form and funding recommendation</text>

  <text x="52" y="465" class="head">5 · Marcus chooses what happens next</text>
  <g>
    <rect x="52" y="486" width="646" height="238" rx="14" fill="#fff" stroke="#b7ccd5"/>
    <path d="M66 487h618" stroke="#4d7990" stroke-width="4"/>
    <text x="76" y="520" class="label">Standalone action · Prepare an address change</text>
    <text x="76" y="553" class="body">CCRE rule · Mailing address update requested.</text>
    <text x="76" y="581" class="code">account.address.prepare@1.0.0</text>
    <text x="76" y="616" class="label">sfield runs</text>
    <text x="76" y="645" class="code">1. treatment.select   2. address.update.prepare</text>
    <text x="76" y="682" class="body">It rechecks eligibility and prepares the submitted form.</text>
    <text x="76" y="707" class="label">Chat result · Address change prepared for review</text>
    <rect x="718" y="486" width="670" height="238" rx="14" fill="#fff" stroke="#b4cbba"/>
    <path d="M732 487h642" stroke="#477b59" stroke-width="4"/>
    <text x="742" y="520" class="label">Workflow · Preview funding</text>
    <text x="742" y="553" class="body">CCRE rule · Account is unfunded. The funding card qualifies.</text>
    <text x="742" y="581" class="code">account.funding.preview@1.0.0</text>
    <text x="742" y="616" class="label">sfield runs the saved sequence</text>
    <text x="742" y="645" class="code">1. funding.status.read   2. funding.options.read</text>
    <text x="742" y="671" class="code">3. funding.preview.build</text>
    <text x="742" y="707" class="label">Chat result · $250 bank-transfer preview</text>
  </g>
  <rect x="52" y="747" width="1336" height="43" rx="9" fill="#eaf1ec"/>
  <text x="720" y="775" class="body" text-anchor="middle">TS owns the eligibility rules across channels. sfield resolves each reference, runs the tools and records the outcome.</text>
</svg>
